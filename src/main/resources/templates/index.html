<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{app.title} + ' — ' + #{app.tagline}">Tòa Án Mèo Đêm</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Cat Theme CSS -->
  <link rel="stylesheet" th:href="@{/css/cat-theme.css}">
</head>
<body>

  <!-- Shared SVG Animations -->
  <th:block th:replace="~{fragments/cat-illustrations :: cat-svg-styles}"></th:block>

  <!-- Top Sticky Header with Audio Controls -->
  <div th:replace="~{fragments/cat-header :: cat-navbar}"></div>

  <!-- Main Game Container (Mobile-first max-width: 480px) -->
  <div class="cat-game-container">

    <!-- Hero Section / Animated Detective Cat Logo -->
    <div class="text-center my-3 animate-fade-in">
      <div th:replace="~{fragments/cat-illustrations :: logo-detective-cat}"></div>
      <h1 class="cat-title mt-2 mb-1" th:text="#{app.title}">Tòa Án Mèo Đêm</h1>
      <p class="cat-subtitle" th:text="#{app.tagline}">Ai là kẻ giả mạo giữa bầy mèo?</p>
    </div>

    <!-- Error Alert if redirected -->
    <div th:if="${errorMessageKey != null}"
         class="alert alert-danger border border-3 border-dark rounded-4 mb-3 py-2 text-center animate-bounce fw-bold"
         style="background: #FFE3E3; color: #D6336C;">
      <span>😿 </span>
      <span th:text="#{${errorMessageKey}}">Có lỗi xảy ra!</span>
    </div>

    <!-- 2-Tab Navigation Container -->
    <div class="cat-card animate-fade-in p-3">

      <!-- Navigation Tabs -->
      <ul class="nav nav-pills nav-fill mb-3 gap-2" id="homeTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="cat-btn cat-btn-gold cat-btn-sm w-100 active"
                  id="tab-create-btn"
                  data-bs-toggle="pill"
                  data-bs-target="#tab-create"
                  type="button"
                  role="tab"
                  aria-controls="tab-create"
                  aria-selected="true">
            <span>🏛️</span>
            <span th:text="#{home.tab.create}">Tạo phòng</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="cat-btn cat-btn-pink cat-btn-sm w-100"
                  id="tab-join-btn"
                  data-bs-toggle="pill"
                  data-bs-target="#tab-join"
                  type="button"
                  role="tab"
                  aria-controls="tab-join"
                  aria-selected="false">
            <span>🚪</span>
            <span th:text="#{home.tab.join}">Vào phòng</span>
          </button>
        </li>
      </ul>

      <!-- Tab Content Panes -->
      <div class="tab-content pt-2" id="homeTabsContent">

        <!-- TAB 1: TẠO PHÒNG -->
        <div class="tab-pane fade show active" id="tab-create" role="tabpanel" aria-labelledby="tab-create-btn">
          <form id="create-room-form" novalidate>
            <div class="mb-3">
              <label for="create-nickname" class="cat-label" th:text="#{home.nickname.label}">Danh xưng của Hoàng thượng</label>
              <input type="text"
                     id="create-nickname"
                     name="nickname"
                     class="cat-input"
                     maxlength="15"
                     required
                     th:placeholder="#{home.nickname.placeholder}"
                     autocomplete="off">
              <div class="invalid-feedback fw-bold mt-1" id="create-nickname-err" th:text="#{validation.nickname.length}">
                Tên hiệu phải từ 2-15 ký tự, thưa Hoàng thượng!
              </div>
            </div>

            <button type="submit" class="cat-btn cat-btn-gold cat-btn-block" id="btn-submit-create">
              <span>🐾</span>
              <span th:text="#{home.create.btn}">Lập Phòng Xử Án</span>
            </button>
          </form>
        </div>

        <!-- TAB 2: VÀO PHÒNG -->
        <div class="tab-pane fade" id="tab-join" role="tabpanel" aria-labelledby="tab-join-btn">
          <form id="join-room-form" novalidate>
            <div class="mb-3">
              <label for="join-nickname" class="cat-label" th:text="#{home.nickname.label}">Danh xưng của Hoàng thượng</label>
              <input type="text"
                     id="join-nickname"
                     name="nickname"
                     class="cat-input"
                     maxlength="15"
                     required
                     th:placeholder="#{home.nickname.placeholder}"
                     autocomplete="off">
              <div class="invalid-feedback fw-bold mt-1" id="join-nickname-err" th:text="#{validation.nickname.length}">
                Tên hiệu phải từ 2-15 ký tự!
              </div>
            </div>

            <div class="mb-3">
              <label for="join-roomcode" class="cat-label" th:text="#{home.roomcode.label}">Mã phòng xử án (5 ký tự)</label>
              <input type="text"
                     id="join-roomcode"
                     name="roomCode"
                     class="cat-input text-uppercase font-monospace text-center fs-4 fw-bold"
                     maxlength="5"
                     required
                     placeholder="ABCDE"
                     autocomplete="off">
              <div class="invalid-feedback fw-bold mt-1" id="join-roomcode-err" th:text="#{validation.roomcode.format}">
                Mã phòng phải gồm đúng 5 ký tự chữ hoặc số in hoa!
              </div>
            </div>

            <button type="submit" class="cat-btn cat-btn-pink cat-btn-block" id="btn-submit-join">
              <span>🚪</span>
              <span th:text="#{home.join.btn}">Tham Gia Phiên Tòa</span>
            </button>
          </form>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-4 mb-2 small text-muted" th:text="#{app.footer}">
      © Tòa Án Mèo Đêm — Công lý thuộc về loài mèo meow~
    </footer>
  </div>

  <!-- Bootstrap JS (needed for pills / tabs) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Cat Audio Script -->
  <script th:src="@{/js/cat-audio.js}"></script>

  <!-- Client-side Real-time Validation & AJAX Submission Script -->
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      const contextPath = /*[[@{/}]]*/ '/';
      const basePath = contextPath.endsWith('/') ? contextPath : (contextPath + '/');

      // Nickname regex: 2-15 chars, no leading/trailing spaces, no double spaces, letters (with VN diacritics), digits, underscores
      // rules.md: "2–15 ký tự, không khoảng trắng ở hai đầu, không có 2 khoảng trắng liên tiếp, chỉ cho phép chữ cái (có dấu tiếng Việt), chữ số và gạch dưới."
      const nicknameRegex = /^[\p{L}\p{N}_]+( [\p{L}\p{N}_]+)*$/u;
      // Room code regex: exactly 5 alphanumeric chars
      const roomCodeRegex = /^[A-Z0-9]{5}$/;

      function validateNickname(input) {
        const raw = input.value;
        const val = raw.trim();

        // Check length 2-15
        if (val.length < 2 || val.length > 15) {
          showError(input);
          return false;
        }

        // Check no leading/trailing whitespace or double whitespace
        if (raw !== val || raw.includes('  ')) {
          showError(input);
          return false;
        }

        // Check regex pattern
        if (!nicknameRegex.test(val)) {
          showError(input);
          return false;
        }

        showSuccess(input);
        return true;
      }

      function validateRoomCode(input) {
        // Auto-uppercase and remove illegal characters
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        const val = input.value;

        if (val.length === 5 && roomCodeRegex.test(val)) {
          showSuccess(input);
          return true;
        } else {
          input.classList.remove('is-valid');
          if (val.length === 5) {
            showError(input);
          }
          return false;
        }
      }

      function showError(input) {
        input.classList.remove('is-valid');
        input.classList.add('is-invalid');
        if (input.value.length > 0) {
          CatAudio.playHiss(); // 😾 Angry cat hiss on validation error
        }
      }

      function showSuccess(input) {
        input.classList.remove('is-invalid');
        input.classList.add('is-valid');
      }

      // Input event bindings for Create Form
      const createNick = document.getElementById('create-nickname');
      createNick.addEventListener('input', () => validateNickname(createNick));

      document.getElementById('create-room-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!validateNickname(createNick)) {
          createNick.focus();
          return;
        }

        const btn = document.getElementById('btn-submit-create');
        btn.disabled = true;

        try {
          const res = await fetch(basePath + 'api/rooms/create?nickname=' + encodeURIComponent(createNick.value.trim()), {
            method: 'POST'
          });
          const data = await res.json();

          if (res.ok && data.roomCode) {
            CatAudio.playMeow();
            window.location.href = `${basePath}room/${data.roomCode}?playerId=${data.playerId}&host=true`;
          } else {
            CatAudio.playHiss();
            alert(data.error || 'Lỗi tạo phòng!');
            btn.disabled = false;
          }
        } catch (err) {
          CatAudio.playHiss();
          alert('Không thể kết nối đến Tòa Án Mèo! meow~');
          btn.disabled = false;
        }
      });

      // Input event bindings for Join Form
      const joinNick = document.getElementById('join-nickname');
      const joinCode = document.getElementById('join-roomcode');
      joinNick.addEventListener('input', () => validateNickname(joinNick));
      joinCode.addEventListener('input', () => validateRoomCode(joinCode));

      // Auto-fill from QR Code Scan URL (?join=CODE)
      const urlParams = new URLSearchParams(window.location.search);
      const joinParam = urlParams.get('join');
      if (joinParam && joinCode) {
        joinCode.value = joinParam.toUpperCase();
        validateRoomCode(joinCode);
        const joinTabBtn = document.getElementById('tab-join-btn');
        if (joinTabBtn && window.bootstrap) {
          const tab = new bootstrap.Tab(joinTabBtn);
          tab.show();
        }
        if (joinNick) joinNick.focus();
      }

      document.getElementById('join-room-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const validNick = validateNickname(joinNick);
        const validCode = validateRoomCode(joinCode);

        if (!validNick || !validCode) {
          CatAudio.playHiss();
          return;
        }

        const btn = document.getElementById('btn-submit-join');
        btn.disabled = true;

        try {
          const res = await fetch(`${basePath}api/rooms/join?roomCode=${encodeURIComponent(joinCode.value)}&nickname=${encodeURIComponent(joinNick.value.trim())}`, {
            method: 'POST'
          });
          const data = await res.json();

          if (res.ok && data.roomCode) {
            CatAudio.playMeow();
            window.location.href = `${basePath}room/${data.roomCode}?playerId=${data.playerId}&host=false`;
          } else {
            CatAudio.playHiss();
            alert(data.error || 'Lỗi vào phòng!');
            btn.disabled = false;
          }
        } catch (err) {
          CatAudio.playHiss();
          alert('Không thể kết nối đến phòng này! meow~');
          btn.disabled = false;
        }
      });
    });
  </script>

</body>
</html>
