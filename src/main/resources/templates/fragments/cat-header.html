<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Header Navigation Bar Fragment -->
<header th:fragment="cat-navbar" class="cat-header">
  <!-- Brand / Logo Link -->
  <a th:href="@{/}" class="cat-logo">
    <span class="fs-4">🐾</span>
    <span th:text="#{app.title}">Tòa Án Mèo Đêm</span>
  </a>

  <!-- Header Controls: Audio Cluster & Language Selector -->
  <div class="cat-header-controls d-flex align-items-center gap-2">
    <!-- Audio Controls Cluster -->
    <div class="cat-audio-controls">
      <!-- BGM Toggle Button -->
      <button type="button"
              id="cat-bgm-toggle"
              class="cat-audio-btn"
              title="Bật/Tắt Nhạc Nền 🎵"
              aria-label="Toggle Background Music">
        🎵
      </button>

      <!-- Volume Slider Toggle Popover -->
      <div class="position-relative">
        <button type="button"
                id="cat-volume-toggle"
                class="cat-audio-btn"
                title="Âm Lượng 🎚️"
                aria-label="Adjust Volume">
          🔊
        </button>
        <div id="cat-volume-popover" class="cat-audio-popover d-none">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="small fw-bold" style="font-family: var(--cat-font-heading);">Âm lượng</span>
            <span class="badge rounded-pill bg-dark text-warning" id="cat-vol-display">18%</span>
          </div>
          <input type="range"
                 id="cat-volume-slider"
                 min="0"
                 max="100"
                 value="18"
                 aria-label="Volume slider">
        </div>
      </div>

      <!-- SFX Toggle Button -->
      <button type="button"
              id="cat-sfx-toggle"
              class="cat-audio-btn active"
              title="Bật/Tắt Hiệu Ứng 🐾"
              aria-label="Toggle Sound Effects">
        🐾
      </button>
    </div>

    <!-- Language Selector Pill -->
    <div class="d-flex align-items-center bg-dark p-1 rounded-pill border border-2 border-dark">
      <a th:href="@{/(lang='vi')}"
         class="btn btn-sm py-0 px-2 rounded-pill text-decoration-none fw-bold"
         th:classappend="${#locale != null and #locale.language == 'vi'} ? 'cat-btn-gold' : 'text-light'"
         title="Tiếng Việt">
        VI
      </a>
      <a th:href="@{/(lang='en')}"
         class="btn btn-sm py-0 px-2 rounded-pill text-decoration-none fw-bold"
         th:classappend="${#locale != null and #locale.language == 'en'} ? 'cat-btn-gold' : 'text-light'"
         title="English">
        EN
      </a>
    </div>
  </div>

  <script>
    // Volume display helper
    document.addEventListener('DOMContentLoaded', function() {
      const slider = document.getElementById('cat-volume-slider');
      const display = document.getElementById('cat-vol-display');
      if (slider && display) {
        slider.addEventListener('input', function(e) {
          display.textContent = e.target.value + '%';
        });
      }
    });
  </script>
</header>

</body>
</html>
