<!-- ============================================================ -->
<!-- Shared CSS Animations for all SVG cat illustrations           -->
<!-- ============================================================ -->
<style th:fragment="cat-svg-styles">
  /* Blink animation - mắt nháy */
  @keyframes cat-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  /* Ear twitch */
  @keyframes ear-twitch {
    0%, 88%, 100% { transform: rotate(0deg); }
    91% { transform: rotate(8deg); }
    94% { transform: rotate(-3deg); }
    97% { transform: rotate(2deg); }
  }

  /* Magnifier wobble for detective */
  @keyframes magnifier-wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(5deg); }
  }

  /* Glasses glint for spy */
  @keyframes glasses-glint {
    0%, 85%, 100% { opacity: 0; }
    90% { opacity: 0.8; }
    95% { opacity: 0; }
  }

  /* Eye shift left-right for mrwhite */
  @keyframes eye-shift {
    0%, 35%, 100% { transform: translateX(0); }
    15% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    70% { transform: translateX(-1px); }
  }

  /* Floating question mark */
  @keyframes float-question {
    0%, 100% { transform: translateY(0); opacity: 0.7; }
    50% { transform: translateY(-8px); opacity: 1; }
  }

  /* Box wobble for mrwhite */
  @keyframes box-wobble {
    0%, 85%, 100% { transform: rotate(0deg); }
    89% { transform: rotate(2deg); }
    93% { transform: rotate(-2deg); }
    96% { transform: rotate(1deg); }
  }

  /* Tail swish */
  @keyframes tail-swish {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(10deg); }
  }

  /* Utility classes for SVG animations */
  .cat-eyes-blink {
    animation: cat-blink 4s ease-in-out infinite;
    transform-origin: center center;
  }
  .cat-eyes-blink-slow {
    animation: cat-blink 5s ease-in-out infinite;
    transform-origin: center center;
  }
  .cat-ear-twitch {
    animation: ear-twitch 5s ease-in-out infinite;
  }
  .cat-magnifier-wobble {
    animation: magnifier-wobble 3s ease-in-out infinite;
    transform-origin: center center;
  }
  .cat-glasses-glint {
    animation: glasses-glint 6s ease-in-out infinite;
  }
  .cat-eye-shift {
    animation: eye-shift 3s ease-in-out infinite;
  }
  .cat-float-question {
    animation: float-question 2s ease-in-out infinite;
  }
  .cat-box-wobble {
    animation: box-wobble 4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .cat-tail-swish {
    animation: tail-swish 2.5s ease-in-out infinite;
    transform-origin: bottom center;
  }
</style>
